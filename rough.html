    <style>
        :root {
            /* Primary Colors */
            --red-dark:#970005;
            --red-main:#ED0101;
            --blue-main:#0C44AC;
            --blue-dark:#000052;
            --white:#FFFFFF;
            
            /* Secondary Colors */

            --blue-light:#4A90D9;

            --gold:#D4AF37;

            --teal:#20B2AA;
            --teal-light:#E0F7F5;
            --gray-100:#F8FAFC;
            --gray-200:#E2E8F0;
            --gray-300:#CBD5E1;
            --gray-500:#64748B;
            --gray-700:#334155;
        }

        body { font-family: 'Inter', sans-serif; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in-up { animation: fadeInUp 0.8s ease forwards; }

        /* Initial hidden state for scroll animations */
        .scroll-animate {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .scroll-animate.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Dropdown transition logic for desktop */
        .dropdown:hover .dropdown-menu {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        
        .dropdown-menu {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        /* Mobile menu styling */
        #mobileMenu { display: none; }
        #mobileMenu.active { display: flex; flex-direction: column; }
        
        .mobile-dropdown-content { display: none; }
        .mobile-dropdown-content.active { display: block; }
    </style>
</head>

    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            const icon = document.getElementById('menuIcon');
            const isActive = menu.classList.toggle('active');
            
            if (isActive) {
                icon.classList.replace('fa-bars', 'fa-times');
            } else {
                icon.classList.replace('fa-times', 'fa-bars');
            }
        }

        function toggleMobileDropdown(id) {
            const content = document.getElementById(id);
            const chevron = document.getElementById('productsChevron');
            content.classList.toggle('active');
            chevron.classList.toggle('rotate-180');
        }

        // Close menu when clicking outside
        window.addEventListener('click', function(e) {
            const menu = document.getElementById('mobileMenu');
            const menuBtn = document.querySelector('[onclick="toggleMobileMenu()"]');
            if (menu && menu.classList.contains('active') && !menu.contains(e.target) && !menuBtn.contains(e.target)) {
                toggleMobileMenu();
            }
        });
    </script>
